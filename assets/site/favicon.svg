    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b45cc"/>
      <stop offset="1" stop-color="#bf1f6a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="10" fill="#f4f4f2"/>
  <text x="32" y="46" text-anchor="middle"
        font-family="Mulish, 'Proxima Nova', -apple-system, 'Segoe UI', sans-serif"
        font-size="42" font-weight="800" letter-spacing="-1" fill="url(#brand)">t<tspan fill="#1560bd">-</tspan>a</text>
</svg>
