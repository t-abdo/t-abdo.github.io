  <script>
    // Runs before first paint: apply the saved theme and skip the loader on repeat visits.
    // Without a saved choice the clock decides, as in theme.js: dark from 18:00
    // to 06:00. It is repeated here because this has to run before any module.
    try {
      var hour = new Date().getHours();
      var theme = localStorage.getItem('portfolio-theme') || (hour >= 18 || hour < 6 ? 'dark' : 'light');
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      if (localStorage.getItem('portfolio-loader-seen')) document.documentElement.classList.add('loader-seen');
    } catch (e) {}
  </script>
